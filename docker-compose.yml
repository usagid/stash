services:
  stash:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${STASH_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      STASH_DATABASE_PATH: /data/stashes.sqlite
    volumes:
      - stash-data:/data

volumes:
  stash-data:
